<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de produtos</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
    <style>
        body {
            background: #f3f4f6;
        }
        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
        }
    </style>
</head>

<body>
<main>
    <h1 id="tituloForm" class="h3 mb-4">Cadastrar produto</h1>
    <form id="formProduto">
        <!-- Campo oculto necessário para sabermos qual ID estamos editando no CRUD -->
        <input type="hidden" id="produtoId">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input
                    id="nome"
                    class="form-control"
                    type="text"
                    maxlength="100"
                    required
            >
        </div>
        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input
                    id="preco"
                    class="form-control"
                    type="number"
                    min="0.01"
                    max="99999999.99"
                    step="0.01"
                    required
            >
        </div>

        <button id="botaoSalvar" class="btn btn-primary" type="submit">
            Salvar
        </button>
        <button id="botaoCancelar" class="btn btn-secondary d-none" type="button">
            Cancelar Edição
        </button>
    </form>
    <p id="mensagem" class="mt-3" role="status"></p>

    <!-- CORREÇÃO: Tabela adicionada para o JavaScript conseguir injetar os dados -->
    <h2 class="h4 mt-5 mb-3">Produtos Cadastrados</h2>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th class="text-end">Ações</th>
            </tr>
            </thead>
            <tbody id="tabelaProdutos">
            <!-- O JavaScript vai preencher este espaço -->
            </tbody>
        </table>
    </div>

</main>

<script>
    const formulario = document.getElementById("formProduto");
    const mensagem = document.getElementById("mensagem");
    const botaoSalvar = document.getElementById("botaoSalvar");
    const inputId = document.getElementById("produtoId");
    const tituloForm = document.getElementById("tituloForm");
    const botaoCancelar = document.getElementById("botaoCancelar");
    const tabelaProdutos = document.getElementById("tabelaProdutos");

    // 1. READ: Buscar do banco e injetar no HTML
    async function carregarProdutos() {
        try {
            const resposta = await fetch("/api/produtos");

            if (resposta.status === 204) {
                tabelaProdutos.innerHTML = `<tr><td colspan="4" class="text-center text-muted">Nenhum produto cadastrado no banco de dados.</td></tr>`;
                return;
            }

            if (!resposta.ok) throw new Error("Erro ao carregar dados do servidor.");

            const produtos = await resposta.json();
            tabelaProdutos.innerHTML = "";

            produtos.forEach(produto => {
                const linha = document.createElement("tr");

                linha.innerHTML = `
                    <td>${produto.id}</td>
                    <td>${produto.nome}</td>
                    <td>R$ ${parseFloat(produto.preco).toFixed(2)}</td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-warning me-1" onclick="prepararEdicao(${produto.id}, '${produto.nome}', ${produto.preco})">Editar</button>
                        <button class="btn btn-sm btn-danger" onclick="deletarProduto(${produto.id})">Excluir</button>
                    </td>
                `;
                tabelaProdutos.appendChild(linha);
            });
        } catch (erro) {
            mensagem.textContent = "Não foi possível exibir os produtos: " + erro.message;
            mensagem.className = "mt-3 text-danger";
        }
    }

    // 2. CREATE & UPDATE: Enviar dados cadastrados ou editados ao Java
    formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const id = inputId.value;
        const produto = {
            nome: document.getElementById("nome").value.trim(),
            preco: parseFloat(document.getElementById("preco").value) // Convertido para número decimal puro
        };

        // Se tiver ID vai para PUT (atualizar), senão vai para POST (cadastrar)
        const url = id ? `/api/produtos/${id}` : "/api/produtos";
        const metodo = id ? "PUT" : "POST";

        botaoSalvar.disabled = true;
        mensagem.textContent = "Salvando...";
        mensagem.className = "mt-3 text-secondary";

        try {
            const resposta = await fetch(url, {
                method: metodo,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(produto)
            });

            const textoResposta = await resposta.text();

            if (!resposta.ok) {
                throw new Error(textoResposta || "Não foi possível salvar o produto.");
            }

            mensagem.textContent = textoResposta;
            mensagem.className = "mt-3 text-success";

            resetarFormulario();
            carregarProdutos(); // Atualiza a tabela com o novo dado do banco
        } catch (erro) {
            mensagem.textContent = erro.message;
            mensagem.className = "mt-3 text-danger";
        } finally {
            botaoSalvar.disabled = false;
        }
    });

    // 3. DELETE: Função para apagar o produto pelo ID
    async function deletarProduto(id) {
        if (!confirm("Tem certeza que deseja excluir este produto?")) return;

        try {
            const resposta = await fetch(`/api/produtos/${id}`, {
                method: "DELETE"
            });

            const textoResposta = await resposta.text();

            if (!resposta.ok) throw new Error(textoResposta || "Não foi possível excluir.");

            mensagem.textContent = textoResposta;
            mensagem.className = "mt-3 text-success";
            carregarProdutos(); // Recarrega a lista atualizada
        } catch (erro) {
            mensagem.textContent = erro.message;
            mensagem.className = "mt-3 text-danger";
        }
    }

    // Funções auxiliares para alternar entre Modo de Cadastro e Modo de Edição
    function prepararEdicao(id, nome, preco) {
        tituloForm.textContent = "Editar produto";
        inputId.value = id;
        document.getElementById("nome").value = nome;
        document.getElementById("preco").value = preco;
        botaoCancelar.classList.remove("d-none");
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetarFormulario() {
        formulario.reset();
        inputId.value = "";
        tituloForm.textContent = "Cadastrar produto";
        botaoCancelar.classList.add("d-none");
    }

    botaoCancelar.addEventListener("click", resetarFormulario);

    // Executa o carregamento inicial assim que a tela abre
    window.addEventListener("DOMContentLoaded", carregarProdutos);
</script>
</body>
</html>
