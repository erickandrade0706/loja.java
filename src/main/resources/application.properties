# ==========================================
# CONFIGURAÇÕES GERAIS DA APLICAÇÃO
# ==========================================
# Nome da aplicação (usado em logs e métricas)
spring.application.name=loja

# ==========================================
# CONFIGURAÇÃO DE VISÃO (MVC / JSP)
# ==========================================
# Pasta onde as páginas JSP estão armazenadas
spring.mvc.view.prefix=/WEB-INF/jsp/
# Extensão padrão dos arquivos de visualização
spring.mvc.view.suffix=.jsp

# ==========================================
# CONEXÃO COM O BANCO DE DADOS (MySQL)
# ==========================================
# URL de conexão com o banco 'loja_senac' e parâmetros de fuso horário/segurança
spring.datasource.url=jdbc:mysql://localhost:3306/loja_senac?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
# Driver de conexão JDBC do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Usuário do banco de dados
spring.datasource.username=root
# Senha do banco de dados (vazia)
spring.datasource.password=

# ==========================================
# INICIALIZAÇÃO DE SCRIPTS SQL
# ==========================================
# Executa os arquivos schema.sql ou data.sql sempre que a aplicação iniciar
spring.sql.init.mode=always

# ==========================================
# CONFIGURAÇÕES DO JPA / HIBERNATE (ORM)
# ==========================================
# Dialeto do Hibernate para gerar comandos SQL compatíveis com o MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Atualiza automaticamente as tabelas no banco com base nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update
# Exibe os comandos SQL executados no console
spring.jpa.show-sql=true
# Formata os comandos SQL no console para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true